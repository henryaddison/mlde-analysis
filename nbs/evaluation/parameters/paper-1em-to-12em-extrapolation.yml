desc: |
    Comparison of diffusion models trained on just one ensemble member and one time period vs 1 ensemble member three time period vs 12 ensemble members and three time periods
    Test split
    12em dataset and models, 60km inputs -> 8.8km outputs, pSTV input variable set
    Compare techniques: diffusion, u-net, bilinear

    Evaluated on all 3 time periods and all 12 ensemble members

    <span style="color:red">!!!!NB single sample per emulator!!!!</span>
eval_vars: [pr]
derived_variables_config: {}
dataset_configs:
    CPM: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
split: "test"
ensemble_members: ["01", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "15"]
samples_per_run: 1 # 6
sample_configs:
    CPM:
      - label: cCPM 1em 3TP
        sample_specs:
          - fq_model_id: score-sde/subvpsde/ukcp_local_pr_1em_cncsnpp_continuous/bham-4x_1em_pSTV
            checkpoint: epoch_120
            dataset: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
            input_xfm: bham64_ccpm-4x_1em_psl-sphum4th-temp4th-vort4th_pr-stan
            variables: [pr]
        deterministic: False
        Samples: True
        color: tab:orange
        order: 10
      - label: cCPM 12em 3TP
        sample_specs:
          - fq_model_id: score-sde/subvpsde/ukcp_local_pr_12em_cncsnpp_continuous/bham-4x_12em_pSTV
            checkpoint: epoch_20
            dataset: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
            input_xfm: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr-stan
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:blue
        order: 15
      - label: cCPM 1em 1TP
        sample_specs:
          - fq_model_id: score-sde/subvpsde/ukcp_local_pr_1em_cncsnpp_continuous/bham-4x_1em_pSTV_lowdata
            checkpoint: epoch_300
            dataset: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
            input_xfm: bham64_ccpm-4x_1em_psl-sphum4th-temp4th-vort4th_pr-historic-stan
            variables: [pr]
        deterministic: False
        Samples: True
        color: tab:red
        order: 20
example_percentiles:
  CPM:
    DJF Wet:
      percentile:  0.8
      variable: pr
      season: DJF
    DJF Wettest:
      percentile: 1
      variable: pr
      season: DJF
    JJA Wet:
      percentile:  0.8
      variable: pr
      season: JJA
    JJA Wettest:
      percentile: 1
      variable: pr
      season: JJA
example_overrides: {}
examples_sample_idxs: [2,5]
niterations: 30
