desc: |
    Comparison of diffusion model arch sizes for CPMGEM-pr paper
    Test split
    12em dataset and models, 60km inputs -> 8.8km outputs, pSTV input variable set
    Compare: xs, small, medium, CPMGEM for cCPM inputs

    <span style="color:red">!!!Many samples and ensemble members (and network sizes) still in progress!!!</span>
eval_vars: [pr]
derived_variables_config: {}
dataset_configs:
    CPM: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
    # GCM: bham64_gcm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
