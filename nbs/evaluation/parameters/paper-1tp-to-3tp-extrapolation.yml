desc: |
    Comparison of diffusion models trained on just 1 ensemble member and one time period vs 1 ensemble member and three time periods
    Test split
    12em dataset and models, 60km inputs -> 8.8km outputs, pSTV input variable set
    Compare techniques: diffusion, u-net, bilinear

    Evaluated on all 3 time periods and all 12 ensemble members

    <span style="color:red">!!!!Missing em07 from some emulators!!!!</span>
split: test
ensemble_members: ["01", "04", "05", "06", "08", "09", "10", "11", "12", "13", "15"] # "07"
samples_per_run: 6
dataset_configs:
    CPM: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
sample_configs:
    CPM:
      - label: cCPM 12em 1TP
        sample_specs:
          - fq_model_id: score-sde/subvpsde/ukcp_local_pr_12em_cncsnpp_continuous/bham-4x_12em_pSTV-historic
            checkpoint: epoch_60
            config_hash: 80e58ae81850e3a9
            dataset: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
            input_xfm: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr-historic-stan
            variables: [pr]
        deterministic: False
        Samples: True
        CCS: True
        color: tab:green
        order: 10
      - label: cCPM 12em 3TP
        sample_specs:
          - fq_model_id: score-sde/subvpsde/ukcp_local_pr_12em_cncsnpp_continuous/bham-4x_12em_pSTV
            checkpoint: epoch_20
            dataset: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
            input_xfm: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr-stan
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:blue
        order: 25
