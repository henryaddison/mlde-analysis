desc: |
    Comparison of diffusion models trained on just one ensemble member and one time period vs 12 ensemble members and three time periods
    Test split
    12em dataset and models, 60km inputs -> 8.8km outputs, pSTV input variable set
    Compare techniques: diffusion, u-net, bilinear

    Evaluated on 1 time period (historic) but all 12 ensemble members
eval_vars: [pr]
derived_variables_config: {}
dataset_configs:
    CPM: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr-historic
split: "test"
ensemble_members: ["01", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "15"]
samples_per_run: 6
