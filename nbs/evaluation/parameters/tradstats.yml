desc: |
    Comparison of traditional statistical downscaling approaches to help pick comparisons to CPMGEM-pr paper
    Test split
    12em dataset and models, 60km inputs -> 8.8km outputs, linpr input usually
    Compare techniques: bilinear, BCSD
eval_vars: [pr]
derived_variables_config: {}
dataset_configs:
    CPM: bham64_ccpm-4x_12em_linpr_pr
    GCM: bham64_gcm-60km_12em_rawpr_pr
split: test
ensemble_members: ["01"] #, "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "15"]
samples_per_run: 1
sample_configs:
    CPM:
      - label: cCPM Bilinear
        sample_specs:
          - fq_model_id: id-linpr
            checkpoint: epoch_0
            input_xfm: none
            dataset: bham64_ccpm-4x_12em_linpr_pr
            variables: [pr]
        deterministic: True
        color: tab:grey
        order: 0
        UQ: False
        CCS: False
      - label: cCPM BCSDv1-ws3-notp
        sample_specs:
          - fq_model_id: bcsd/ukcp_local_pr_12em
            checkpoint: epoch-0
            input_xfm: bham64_ccpm-4x_12em_linpr_pr-bcsd
            dataset: bham64_ccpm-4x_12em_linpr_pr
            variables: [pr]
        deterministic: True
        color: tab:red
        order: 1
        UQ: False
        CCS: False
      - label: cCPM BCSDv1-ws3-per-tp
        sample_specs:
          - fq_model_id: bcsd-v1/ukcp_local_pr_12em-ws3
            checkpoint: epoch-0
            input_xfm: bham64_ccpm-4x_12em_linpr_pr-bcsd
            dataset: bham64_ccpm-4x_12em_linpr_pr
            variables: [pr]
        deterministic: True
        color: tab:blue
        order: 1
        UQ: False
        CCS: False
      - label: cCPM BCSDv2-ws3-per-tp
        sample_specs:
          - fq_model_id: bcsd-v2/ukcp_local_pr_12em-ws3
            checkpoint: epoch-0
            input_xfm: bham64_ccpm-4x_12em_linpr_pr-bcsd
            dataset: bham64_ccpm-4x_12em_linpr_pr
            variables: [pr]
        deterministic: True
        color: tab:brown
        order: 1
        UQ: False
        CCS: False
sample_configs_at_60km: []
dataset_configs_at_60km:
    CPM: bham64_ccpm-60km_12em_pr_pr
    GCM: bham64_gcm-60km_12em_rawpr_pr
example_percentiles:
  CPM:
    DJF Wet:
      percentile:  0.8
      variable: pr
      season: DJF
    DJF Wettest:
      percentile: 1
      variable: pr
      season: DJF
    JJA Wet:
      percentile:  0.8
      variable: pr
      season: JJA
    JJA Wettest:
      percentile: 1
      variable: pr
      season: JJA
example_overrides:
    CPM: {"JJA Wet": ["01", "1993-08-01 12:00:00"]}
    GCM: {}
examples_sample_idxs: [2,5]
example_inputs: []
niterations: 30
