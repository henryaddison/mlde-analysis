desc: |
    Comparison of CPMGEM-daily with CPMLatte output coarsened to daily
    Val split
    12em dataset and models, 60km inputs -> 8.8km outputs, pSTV input variable set
eval_vars: [pr]
derived_variables_config: {}
dataset_configs:
    CPM: cpmgem-daily-bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
split: val
ensemble_members: ["01", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "15"]
samples_per_run: 6
sample_configs:
    CPM:
      - label: CPMGEM_cCPM
        sample_specs:
          - fq_model_id: cpmgem-daily/score-sde/subvpsde/ukcp_local_pr_12em_cncsnpp_continuous/bham-4x_12em_pSTV
            checkpoint: epoch_20
            input_xfm: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr-stan
            dataset: bham64_ccpm-4x_12em_psl-sphum4th-temp4th-vort4th_pr
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:blue
        order: 11
      - label: CPMLatte daily sum e50
        sample_specs:
          - fq_model_id: cpmgem-subdaily/latte-b8-daily-cpmgem-daily-preset-4gpus/post/daily
            checkpoint: "0050"
            input_xfm: ""
            dataset: engwales_ccpm-4x-cpmgem_12em_1hr_pr_preset
            config_hash: "1000-steps"
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:orange
        order: 12
      - label: CPMLatte daily mean e50
        sample_specs:
          - fq_model_id: cpmgem-subdaily/latte-b8-daily-mean-cpmgem-daily-preset-4gpus/post/daily
            checkpoint: "0050"
            input_xfm: ""
            dataset: engwales_ccpm-4x-cpmgem_12em_1hr_pr_preset
            config_hash: "1000-steps"
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:green
        order: 13
      # - label: CPMLatte daily sum e200
      #   sample_specs:
      #     - fq_model_id: cpmgem-subdaily/latte-b8-daily-cpmgem-daily-preset-4gpus/post/daily
      #       checkpoint: "0200"
      #       input_xfm: ""
      #       dataset: engwales_ccpm-4x-cpmgem_12em_1hr_pr_preset
      #       config_hash: "1000-steps"
      #       variables: [pr]
      #   deterministic: False
      #   CCS: True
      #   color: tab:red
      #   order: 14
      - label: cNCSN++ lssum e50
        sample_specs:
          - fq_model_id: cpmgem-subdaily/cncsnpp-daily-cpmgem-daily-preset-4gpus-learn-sigma/post/daily
            checkpoint: "0050"
            input_xfm: ""
            dataset: engwales_ccpm-4x-cpmgem_12em_1hr_pr_preset
            config_hash: "1000-steps"
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:red
        order: 15
      - label: cNCSN++ fssum e50
        sample_specs:
          - fq_model_id: cpmgem-subdaily/cncsnpp-daily-cpmgem-daily-preset-4gpus-fixed-sigma/post/daily
            checkpoint: "0050"
            input_xfm: ""
            dataset: engwales_ccpm-4x-cpmgem_12em_1hr_pr_preset
            config_hash: "1000-steps"
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:brown
        order: 16
      - label: cNCSN++ fsmean e50
        sample_specs:
          - fq_model_id: cpmgem-subdaily/cncsnpp-daily-mean-cpmgem-daily-preset-4gpus-fixed-sigma/post/daily
            checkpoint: "0050"
            input_xfm: ""
            dataset: engwales_ccpm-4x-cpmgem_12em_1hr_pr_preset
            config_hash: "1000-steps"
            variables: [pr]
        deterministic: False
        CCS: True
        color: tab:purple
        order: 17
example_percentiles:
  CPM:
    DJF Wet:
      percentile:  0.8
      variable: pr
      season: DJF
    DJF Wettest:
      percentile: 1
      variable: pr
      season: DJF
    JJA Wet:
      percentile:  0.8
      variable: pr
      season: JJA
    JJA Wettest:
      percentile: 1
      variable: pr
      season: JJA
example_overrides:
    CPM: {}
    GCM: {}
examples_sample_idxs: 1
niterations: 30
bootstrap_configs:
    niterations:
      spread-error: 50
