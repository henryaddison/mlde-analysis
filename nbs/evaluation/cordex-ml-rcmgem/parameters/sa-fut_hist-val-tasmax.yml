desc: |
  CORDEX-ML-BENCH
  Emulator hist-fut training experiment
  SA_domain
  val split
  tasmax target variables
  compare s/a and mv models
eval_vars: [tasmax]
target_sim_key: RCM
dataset_configs:
    RCM: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
split: val
ensemble_members: ["01"]
samples_per_run: 1
sample_configs:
    RCM:
      - label: s/a
        sample_specs:
          - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_tasmax_hist_fut_sa_cncsnpp_continuous/no_static_rcmgem
            checkpoint: epoch_240
            dataset: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
            input_xfm: SA_domain-Emulator_hist_future-ACCESSCM2-perfect-stan
            variables: [tasmax]
            config_hash: 012fdb9d67644f91
        deterministic: False
        PSD: True
        color: tab:blue
        order: 11
        CCS: True
      - label: mv
        sample_specs:
          - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_sa_cncsnpp_continuous/no_static_rcmgem
            checkpoint: epoch_220
            dataset: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
            input_xfm: SA_domain-Emulator_hist_future-ACCESSCM2-perfect-stan
            variables: [tasmax]
            config_hash: 424b4a87cdb75581
        deterministic: False
        PSD: True
        color: tab:orange
        order: 12
        CCS: True
      - label: mv orog
        sample_specs:
        - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_sa_cncsnpp_continuous/w_static_rcmgem
          checkpoint: epoch_400
          dataset: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
          input_xfm: SA_domain-Emulator_hist_future-ACCESSCM2-perfect-stan
          variables: [pr]
          config_hash: c57783e989d30a98
        deterministic: False
        PSD: True
        color: tab:green
        order: 13
        CCS: True
example_percentiles:
  RCM:
    DJF Cold: {"percentile": 0.2, "variable": "tasmax", "season": "DJF"}
    DJF Coldest: {"percentile": 0, "variable": "tasmax", "season": "DJF"}
    JJA Warm: {"percentile": 0.8, "variable": "tasmax", "season": "JJA"}
    JJA Hottest: {"percentile": 1.0, "variable": "tasmax", "season": "JJA"}
