desc: |
  CORDEX-ML-BENCH
  Emulator hist-fut training experiment
  ALPS domain
  val split
  tasmax target variables
  RCMGEM_mv model, compare checkpoints
eval_vars: [tasmax]
target_sim_key: RCM
dataset_configs:
    RCM: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
split: val
ensemble_members: ["01"]
samples_per_run: 1
sample_configs:
    RCM:
      - label: mm;recen 120
        sample_specs:
          - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_alps_cncsnpp_continuous/no_static_rcmgem_tasmaxmmrecen
            checkpoint: epoch_120
            dataset: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
            input_xfm: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect-stan
            variables: [tasmax]
            config_hash: 86e8cba9bd5c3c86
        deterministic: False
        PSD: True
        color: tab:blue
        order: 11
        CCS: True
      - label: mm;recen 220
        sample_specs:
