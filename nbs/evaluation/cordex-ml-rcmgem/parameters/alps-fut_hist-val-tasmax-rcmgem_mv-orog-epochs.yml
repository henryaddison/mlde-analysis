desc: |
  CORDEX-ML-BENCH
  Emulator hist-fut training experiment
  ALPS domain
  val split
  tasmax target variables
  RCMGEM_mv w/ orog model, compare checkpoints
eval_vars: [tasmax]
target_sim_key: RCM
dataset_configs:
    RCM: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
split: val
ensemble_members: ["01"]
samples_per_run: 1
sample_configs:
    RCM:
      - label: e100
        sample_specs:
          - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_alps_cncsnpp_continuous/w_static_rcmgem
            checkpoint: epoch_100
            dataset: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
            input_xfm: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect-stan
            variables: [tasmax]
            config_hash: 43711281dc39bc06
        deterministic: False
        PSD: True
        color: tab:blue
        order: 11
        CCS: True
      - label: e200
        sample_specs:
          - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_alps_cncsnpp_continuous/w_static_rcmgem
            checkpoint: epoch_200
            dataset: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
            input_xfm: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect-stan
            variables: [tasmax]
            config_hash: 43711281dc39bc06
        deterministic: False
        PSD: True
        color: tab:orange
        order: 12
        CCS: True
      - label: e300
        sample_specs:
          - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_alps_cncsnpp_continuous/w_static_rcmgem
            checkpoint: epoch_300
            dataset: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
            input_xfm: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect-stan
            variables: [tasmax]
            config_hash: 43711281dc39bc06
        deterministic: False
        PSD: True
        color: tab:green
        order: 13
        CCS: True
