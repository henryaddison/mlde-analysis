desc: |
  CORDEX-ML-BENCH
  Emulator hist-fut training experiment
  ALPS domain
  val split
  pr target variables
  RCMGEM_mv model, compare checkpoints
eval_vars: [pr]
target_sim_key: RCM
dataset_configs:
    RCM: ALPS_domain-Emulator_hist_future-CNRMCM5-perfect
split: val
ensemble_members: ["01"]
