desc: |
  CORDEX-ML-BENCH
  Emulator hist-fut training experiment
  SA_domain
  val split
  pr target variables
  compare s/a and mv models
eval_vars: [pr]
target_sim_key: RCM
dataset_configs:
    RCM: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
split: val
ensemble_members: ["01"]
samples_per_run: 1
sample_configs:
  RCM:
    - label: s/a
      sample_specs:
        - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_pr_hist_fut_sa_cncsnpp_continuous/no_static_rcmgem
          checkpoint: epoch_180
          dataset: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
          input_xfm: SA_domain-Emulator_hist_future-ACCESSCM2-perfect-stan
          variables: [pr]
          config_hash: 835702614e20b9bc
      deterministic: False
      PSD: True
      color: tab:blue
      order: 11
      CCS: True
    - label: mv
      sample_specs:
        - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_sa_cncsnpp_continuous/no_static_rcmgem
          checkpoint: epoch_220
          dataset: SA_domain-Emulator_hist_future-ACCESSCM2-perfect
          input_xfm: SA_domain-Emulator_hist_future-ACCESSCM2-perfect-stan
          variables: [pr]
          config_hash: 424b4a87cdb75581
      deterministic: False
      PSD: True
      color: tab:orange
      order: 12
      CCS: True
    - label: mv orog
      sample_specs:
      - fq_model_id: mlde/score-sde/subvpsde/cordex_ml_mv_hist_fut_sa_cncsnpp_continuous/w_static_rcmgem
